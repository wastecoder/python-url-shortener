# The database this project runs against locally.
#
# Only `postgres` lives here. The `api` service and the Dockerfile arrive in Fase 6, and a compose
# file naming a service nobody has built yet is a file that lies about what `docker compose up`
# does. Until then the application runs on the host -- `uv run uvicorn url_shortener.main:app` --
# and reaches this container through the published port.

services:
  postgres:
    # Pinned to the patch, never `latest` and never a bare major. `latest` makes a fresh clone and
    # a six-month-old checkout run different databases without either of them saying so, and a
    # bare `18` still moves under you on every minor release. 18.6 is the current stable.
    image: postgres:18.6-alpine

    # These three are the DSN in `.env.example`, character for character, so a fresh clone works
    # with no edit. They are development credentials for a container bound to a local port and
    # nothing else; the deployed database's credentials come from the environment, never from here.
    environment:
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: url_shortener
      POSTGRES_DB: url_shortener

    ports:
      - "5432:5432"

    # `/var/lib/postgresql`, and NOT `/var/lib/postgresql/data`. PostgreSQL 18 made the image's
    # `PGDATA` version specific -- it is `/var/lib/postgresql/18/docker` now -- so the parent is
    # the directory that has to be mounted. The old path still mounts without complaint and simply
    # persists nothing: every `docker compose down` would silently be a fresh database.
    volumes:
      - postgres-data:/var/lib/postgresql

    # A container that is up is not a database that is accepting connections. Without this,
    # `docker compose up -d postgres` followed immediately by `alembic upgrade head` is a race that
    # is lost often enough to be annoying and won often enough to look flaky. It is also what the
    # `api` service of Fase 6 will wait on with `condition: service_healthy`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_shortener -d url_shortener"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
