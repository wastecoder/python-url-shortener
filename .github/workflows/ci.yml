# Lean pipeline: no Docker, runs in seconds, and blocks merge from the first pull request.
# The integration job (Testcontainers) joins in Fase 5 and the image build in Fase 6, when there
# is something for them to run. A job that runs nothing proves nothing.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Architecture
        run: uv run lint-imports

      - name: Unit tests
        run: uv run pytest
