# Three jobs, and the first split is the same one the test suite makes.
#
# `check` needs no Docker and finishes in seconds: it is everything that can be decided by reading
# the code, plus the fast test suite, plus the coverage gate on the two layers that suite can
# reach. `integration` starts a real PostgreSQL and runs everything, and carries the gate on the
# whole tree.
#
# They do not depend on each other. A lint error and a broken redirect are independent facts, and
# a pull request that has both should be told both at once rather than one round trip at a time.
# `image` is the third, added in Fase 6, and it is independent of both for the same reason: it
# answers a question neither of the others can, which is whether the thing that gets deployed
# -- the image, the migration and the compose file, not the source tree -- actually serves.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Architecture
        run: uv run lint-imports

      # `--cov-report=` empties the report here: the numbers are printed by the gate below, so
      # they appear once, next to the threshold they are being judged against.
      - name: Unit tests
        run: uv run pytest --cov --cov-report=

      # The gate that matters, and the reason there are two of them rather than one average.
      # `domain` and `application` are where this project's decisions live, and they are fully
      # reachable with no database running -- so a hole here is never "the infrastructure was not
      # up", it is a rule nobody tested. A single number over the whole tree would let a
      # thoroughly tested adapter pay for an untested domain, which is exactly backwards.
      #
      # 100 with no slack. When a line is genuinely unreachable it gets `# pragma: no cover` and a
      # comment saying why, which puts the exception in the diff where a reviewer sees it, instead
      # of hiding it inside a threshold nobody revisits.
      - name: Coverage of the domain and the application
        run: >
          uv run coverage report
          --include="src/url_shortener/domain/*,src/url_shortener/application/*"
          --fail-under=100

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # There is deliberately no `services:` block anywhere in this file. `ubuntu-latest` already
      # runs a Docker daemon, and Testcontainers starts, migrates and throws away its own
      # PostgreSQL from inside the test session -- which is the whole point: the container is
      # declared by the code that needs it, at the version that code pins, and nothing in CI has
      # to be kept in step with `compose.yml` by hand.
      #
      # `-m ""` runs both suites in one process, and not out of convenience: neither suite reaches
      # the gate below on its own. The unit run misses exactly the twelve statements that cannot
      # execute without a real session -- `get_session` and the two repositories -- and nothing
      # else, which is a narrower gap than it sounds and is the interesting number; the integration
      # run misses every error path the unit tests drive with fakes. The gate needs both sets of
      # data, and combining them across two jobs would be machinery bought for a suite that takes
      # under twenty seconds.
      - name: Every test, against a real PostgreSQL
        run: uv run pytest -m "" --cov --cov-report=

      # The second gate. Same number as the one above and a different promise: this one covers the
      # adapter, `main.py` and the wiring, and it is the one that may be argued down in a pull
      # request that explains why. The domain gate is not.
      - name: Coverage of the whole tree
        run: uv run coverage report --fail-under=100

  # The two jobs above run the code. This one runs the artifact, which is a different claim: it
  # builds the image, brings up the same three services a clean clone brings up, and drives the
  # flow the phase promises through the published port. `docker build` alone would prove the image
  # compiles -- not that the migration ran before the server started, not that the non-root user can
  # read what it needs, and not that `BASE_URL` reaches the response.
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the image
        run: docker compose build

      # `--wait` blocks until every service is healthy or, for the one-shot migration, has exited
      # cleanly. It is the same wait a person does by staring at `docker compose ps`, and it fails
      # the job instead of letting the next step race a server that is not listening yet.
      - name: Start the stack
        run: docker compose up -d --wait

      # The phase's own criterion, executed. The redirect is requested exactly once -- `%{http_code}`
      # and `%{redirect_url}` come out of the same call -- so the `total_clicks` assertion below means
      # "one access, one row" rather than "some number greater than zero".
      #
      # `short_url` is asserted out of a body that is already in hand, and that is what makes the claim
      # above about `BASE_URL` true: its value reaches the container only through `compose.yml`, so it
      # is the one part of the response neither of the other two jobs can be right or wrong about.
      #
      # Deduplication is deliberately not asserted here. It is covered against a real PostgreSQL by
      # the integration suite, including under concurrency, and repeating it here would add runtime
      # without adding anything about the image, which is what this job is about.
      - name: Create a link, follow it, and read what it recorded
        run: |
          set -euo pipefail
          target='https://www.example.com/a/very/long/path?with=query'

          status=$(curl -sS -o created.json -w '%{http_code}' \
            -X POST http://localhost:8000/links \
            -H 'content-type: application/json' \
            -d "{\"url\": \"$target\"}")
          test "$status" = 201
          code=$(python3 -c 'import json; print(json.load(open("created.json"))["code"])')

          read -r status location <<<"$(curl -sS -o /dev/null \
            -w '%{http_code} %{redirect_url}' "http://localhost:8000/$code")"
          test "$status" = 302
          test "$location" = "$target"

          curl -sS --fail-with-body -o details.json "http://localhost:8000/links/$code"
          clicks=$(python3 -c 'import json; print(json.load(open("details.json"))["total_clicks"])')
          short_url=$(python3 -c 'import json; print(json.load(open("details.json"))["short_url"])')
          test "$clicks" = 1
          test "$short_url" = "http://localhost:8000/$code"

      # Without this, a failure above is a red X next to a `test` command and nothing else. The
      # answer is almost always in the logs of a container that is about to be thrown away.
      - name: What the containers said, if any of that failed
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      # There is no teardown step on purpose. The runner is destroyed with the job, so a
      # `docker compose down -v` here would be ceremony -- and the local version of it, which does
      # matter, is in the README.
