# Alembic configuration. The scaffolding Alembic ships is mostly commented-out defaults; what is
# left here is what this project actually decided, and every line of it is load-bearing.
#
# `alembic.ini` at the repository root, rather than Alembic 1.16's newer `[tool.alembic]` section in
# `pyproject.toml`, because the repository layout in CLAUDE.md names this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# There is deliberately no `sqlalchemy.url` here.
#
# A DSN in a versioned file is a second source of truth for the single value that decides which
# database gets migrated, and it is the copy nobody remembers to update. `migrations/env.py` reads
# the same `DATABASE_URL` setting the application reads, and falls back to this option only when
# something sets it programmatically -- which is how the Testcontainers fixture of Fase 5 will point
# these same migrations at a throwaway database without touching a file.

[post_write_hooks]
# Every generated revision is formatted and linted the moment it is written.
#
# This is not tidiness. CI runs `ruff check .` and `ruff format --check .` over the whole tree, so a
# revision straight out of `--autogenerate` turns the pipeline red for reasons that have nothing to
# do with the schema it describes. Running the hooks here means that never happens, and it means the
# generated file and a hand-written one are indistinguishable.
#
# `uv run` rather than a path into `.venv`: the executable lives at `.venv/bin/ruff` on Linux and
# `.venv/Scripts/ruff.exe` on Windows, and this project is developed on one and built on the other.
hooks = ruff_format, ruff_check

ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

ruff_check.type = exec
ruff_check.executable = uv
ruff_check.options = run ruff check --fix REVISION_SCRIPT_FILENAME

# Logging, read by `fileConfig` in env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
