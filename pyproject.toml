[project]
name = "url-shortener"
version = "0.1.0"
description = "API que encurta URLs, redireciona e registra cada acesso"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/url_shortener"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
# Without this plugin, mypy --strict reports a false "missing named argument" on Settings().
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
# `tests` is checked too, and not as a nicety: `tests/fakes.py` is where the in-memory stand-ins
# are declared to satisfy the driven ports, and a declaration no type checker reads proves nothing.
files = ["src", "tests"]
# Neither line below is optional. `tests/` has no `__init__.py`, because `--import-mode=importlib`
# means pytest does not need one, so mypy has to be told which directories are package roots. Left
# alone it maps the same file to two module names and stops before checking anything.
mypy_path = ["src", "."]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers --import-mode=importlib"
markers = [
    "integration: precisa de um Docker rodando (Testcontainers)",
]

[tool.coverage.run]
source = ["src/url_shortener"]
branch = true

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.14",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff.lint.isort]
# `tests` is first-party here even though it is not an installed package. Setting `src` above
# drops the default `.` root, so without this line `from tests.fakes import ...` is filed with the
# third-party imports and `ruff check` fails on the ordering.
known-first-party = ["tests"]
